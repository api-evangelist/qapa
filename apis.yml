name: Qapa
description: 'Qapa (qapa.fr) is a Paris-based French online recruitment and temporary-work (interim)
  marketplace that matched companies with job seekers for permanent and temp placements. Backed by Index
  Ventures and Partech, it was majority-acquired by the Adecco Group. The qapa.fr web property is now gated
  behind an Azure Application Gateway (HTTP 403) and exposes no public developer, API, or documentation
  surface; this profile is retained as an API Evangelist network record.'
